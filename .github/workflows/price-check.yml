name: Price Checker

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger price check on backend
        run: |
          API="${API_BASE%/}"
          echo "Triggering price check at $API/check"
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$API/check" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5)
          echo "Response: $(cat /tmp/response.txt)"
          echo "HTTP Status: $STATUS"
          if [ -z "$STATUS" ] || [ "$STATUS" = "000" ]; then
            echo "Could not reach backend at $API"
            exit 1
          fi
          if [ "$STATUS" -ge 400 ]; then
            echo "Price check failed with status $STATUS"
            exit 1
          fi
          echo "Price check triggered successfully"
        env:
          API_BASE: ${{ secrets.API_BASE }}
