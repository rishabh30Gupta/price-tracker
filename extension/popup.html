<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen hidden">
      <div class="header">
        <img src="icons/icon48.png" alt="logo" class="logo" />
        <h1>Price Tracker</h1>
      </div>
      <p class="subtitle">Enter your Telegram Chat ID to get started.</p>
      <div class="form-group">
        <label for="chat-id-input">Telegram Chat ID</label>
        <input type="text" id="chat-id-input" placeholder="e.g. 123456789" />
        <small>Send /start to your bot and it will show your Chat ID.</small>
      </div>
      <div class="form-group">
        <label for="api-url-input">Backend URL</label>
        <input type="text" id="api-url-input" placeholder="https://your-app.railway.app" />
      </div>
      <button id="save-setup-btn" class="btn primary">Save & Continue</button>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="screen hidden">
      <div class="header">
        <img src="icons/icon48.png" alt="logo" class="logo" />
        <h1>Price Tracker</h1>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
      </div>

      <!-- Tab Bar -->
      <div class="tabs">
        <button class="tab active" data-tab="track">Track</button>
        <button class="tab" data-tab="list">My Products</button>
      </div>

      <!-- Track Tab -->
      <div id="tab-track" class="tab-content">
        <div class="form-group">
          <label for="product-url">Product URL</label>
          <input type="url" id="product-url" placeholder="Paste Amazon or Flipkart URL" />
        </div>
        <button id="track-btn" class="btn primary">
          <span id="track-btn-text">Track Price</span>
          <span id="track-spinner" class="spinner hidden"></span>
        </button>
        <div id="track-result" class="result-card hidden"></div>
      </div>

      <!-- List Tab -->
      <div id="tab-list" class="tab-content hidden">
        <div id="products-loading" class="loading-state">
          <div class="spinner"></div>
          <p>Loading...</p>
        </div>
        <div id="products-empty" class="empty-state hidden">
          <div class="empty-icon">📭</div>
          <p>No products tracked yet.</p>
          <p class="hint">Add one from the Track tab!</p>
        </div>
        <div id="products-list"></div>
        <button id="refresh-btn" class="btn secondary">🔄 Refresh</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
